<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Don Film w/ Me — UI Concepts</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.4s ease, color 0.4s ease;
  }

  /* Theme: Option B (light - default) */
  body.theme-b {
    background: #E8ECF0;
    color: #1F2937;
  }

  /* Theme: Option A (dark) */
  body.theme-a {
    background: #1a1a2e;
    color: #F5F0E8;
  }

  .header {
    text-align: center;
    padding: 32px 20px 0;
  }

  .header h1 {
    font-size: 32px;
    font-weight: 700;
    transition: color 0.4s ease;
  }

  body.theme-b .header h1 { color: #2563EB; font-family: 'DM Sans', sans-serif; }
  body.theme-a .header h1 { color: #D4A843; font-family: 'Playfair Display', serif; }

  .header p {
    font-size: 14px;
    margin-top: 6px;
    transition: color 0.4s ease;
  }
  body.theme-b .header p { color: #6B7280; }
  body.theme-a .header p { color: #888; }

  /* Toggle switch */
  .toggle-container {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 24px 0;
  }

  .toggle-label {
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 14px;
    border-radius: 20px;
    transition: all 0.3s ease;
  }

  body.theme-a .toggle-label.label-a {
    background: #D4A843;
    color: #0D0D0D;
  }
  body.theme-a .toggle-label.label-b {
    color: #666;
  }
  body.theme-b .toggle-label.label-a {
    color: #9CA3AF;
  }
  body.theme-b .toggle-label.label-b {
    background: #2563EB;
    color: #fff;
  }

  .switch {
    position: relative;
    width: 56px;
    height: 30px;
    cursor: pointer;
  }

  .switch input { display: none; }

  .slider {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    transition: background 0.3s ease;
  }
  body.theme-a .slider { background: #333; }
  body.theme-b .slider { background: #D1D5DB; }

  .slider::before {
    content: '';
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: transform 0.3s ease, background 0.3s ease;
  }
  body.theme-a .slider::before { background: #D4A843; transform: translateX(0); }
  body.theme-b .slider::before { background: #2563EB; transform: translateX(26px); }

  /* Description line */
  .option-desc {
    font-size: 13px;
    margin-bottom: 20px;
    transition: color 0.4s ease;
    text-align: center;
    max-width: 500px;
    padding: 0 20px;
  }
  body.theme-a .option-desc { color: #aaa; }
  body.theme-b .option-desc { color: #6B7280; }

  /* Iframe container */
  .mockup-frame {
    width: 100%;
    max-width: 900px;
    flex: 1;
    min-height: 900px;
    border: none;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 40px;
  }

  body.theme-a .mockup-frame {
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  body.theme-b .mockup-frame {
    box-shadow: 0 8px 40px rgba(0,0,0,0.1);
  }

  .footer {
    padding: 20px;
    font-size: 12px;
    text-align: center;
    transition: color 0.4s ease;
  }
  body.theme-a .footer { color: #555; }
  body.theme-b .footer { color: #9CA3AF; }
</style>
</head>
<body class="theme-b">

<div class="header">
  <h1>Don Film w/ Me</h1>
  <p>Mobile-first talent matching for film &amp; photography</p>
</div>

<div class="toggle-container">
  <span class="toggle-label label-a" onclick="setOption('a')">A: Dark &amp; Cinematic</span>
  <label class="switch">
    <input type="checkbox" id="themeToggle" checked onchange="toggleOption()">
    <span class="slider"></span>
  </label>
  <span class="toggle-label label-b" onclick="setOption('b')">B: Clean &amp; Professional</span>
</div>

<p class="option-desc" id="optionDesc">Modern SaaS meets talent marketplace. Light, airy, trustworthy.</p>

<iframe class="mockup-frame" id="mockupFrame" src="mockups/option-b-professional.html"></iframe>

<div class="footer">Don Film w/ Me &mdash; UI/UX Concept Previews</div>

<script>
function setOption(option) {
  var toggle = document.getElementById('themeToggle');
  if (option === 'a') {
    toggle.checked = false;
  } else {
    toggle.checked = true;
  }
  applyOption();
}

function toggleOption() {
  applyOption();
}

function applyOption() {
  var toggle = document.getElementById('themeToggle');
  var body = document.body;
  var frame = document.getElementById('mockupFrame');
  var desc = document.getElementById('optionDesc');

  if (toggle.checked) {
    body.className = 'theme-b';
    frame.src = 'mockups/option-b-professional.html';
    desc.textContent = 'Modern SaaS meets talent marketplace. Light, airy, trustworthy.';
  } else {
    body.className = 'theme-a';
    frame.src = 'mockups/option-a-cinematic.html';
    desc.textContent = 'Film set at golden hour. Dark backgrounds, gold accents, cinematic type.';
  }
}
</script>

</body>
</html>
